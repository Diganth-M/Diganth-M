name: Build developer workstation animation
on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/generate_developer_animation.py
      - .github/workflows/developer-animation.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Render animated GIF
        run: python scripts/generate_developer_animation.py
      - name: Commit animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add developer-live-environment.gif
          git commit -m "Generate animated developer workstation" || echo "No animation changes"
          git pull --rebase origin main
          git push
