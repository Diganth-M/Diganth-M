<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Diganth — Java Developer</title>
<desc id="desc">A dark, polished Java developer workstation with animated code, Java symbol, terminal output and glowing data paths.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset=".55" stop-color="#101c32"/><stop offset="1" stop-color="#111827"/></linearGradient>
 <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#132a43"/><stop offset="1" stop-color="#091523"/></linearGradient>
 <linearGradient id="cyan"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
 <linearGradient id="orange"><stop stop-color="#fb923c"/><stop offset="1" stop-color="#f97316"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#24405a" stroke-opacity=".28"/></pattern>
</defs>
<rect width="1000" height="390" rx="22" fill="url(#bg)"/>
<rect width="1000" height="390" rx="22" fill="url(#grid)"/>
<circle cx="820" cy="78" r="150" fill="#1d4ed8" opacity=".08"/>
<circle cx="150" cy="320" r="190" fill="#0891b2" opacity=".07"/>
<path d="M40 64H960" stroke="#29445e"/>
<circle cx="58" cy="36" r="6" fill="#34d399"/><text x="78" y="42" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">DIGANTH  /  JAVA DEVELOPER</text>
<text x="940" y="41" text-anchor="end" fill="#67e8f9" font-family="monospace" font-size="11">BUILD • DEBUG • DEPLOY</text>
<!-- left code editor -->
<rect x="42" y="88" width="560" height="248" rx="13" fill="url(#screen)" stroke="#25617c" stroke-width="1.4"/>
<path d="M42 124H602" stroke="#25465f"/>
<circle cx="64" cy="106" r="4" fill="#fb7185"/><circle cx="80" cy="106" r="4" fill="#fbbf24"/><circle cx="96" cy="106" r="4" fill="#34d399"/>
<text x="122" y="110" fill="#94a3b8" font-family="monospace" font-size="11">Application.java</text>
<text x="68" y="151" fill="#64748b" font-family="monospace" font-size="12">01</text><text x="102" y="151" fill="#c4b5fd" font-family="monospace" font-size="13">package</text><text x="168" y="151" fill="#e2e8f0" font-family="monospace" font-size="13">com.diganth.dev;</text>
<text x="68" y="178" fill="#64748b" font-family="monospace" font-size="12">02</text><text x="102" y="178" fill="#c4b5fd" font-family="monospace" font-size="13">public class</text><text x="213" y="178" fill="#fbbf24" font-family="monospace" font-size="13">Application</text><text x="305" y="178" fill="#e2e8f0" font-family="monospace" font-size="13">{</text>
<text x="68" y="205" fill="#64748b" font-family="monospace" font-size="12">03</text><text x="124" y="205" fill="#c4b5fd" font-family="monospace" font-size="13">public static void</text><text x="277" y="205" fill="#7dd3fc" font-family="monospace" font-size="13">main</text><text x="315" y="205" fill="#e2e8f0" font-family="monospace" font-size="13">(String[] args) {</text>
<text x="68" y="232" fill="#64748b" font-family="monospace" font-size="12">04</text><text x="145" y="232" fill="#86efac" font-family="monospace" font-size="13">System.out.println</text><text x="295" y="232" fill="#e2e8f0" font-family="monospace" font-size="13">(</text><text x="304" y="232" fill="#fda4af" font-family="monospace" font-size="13">"Building something great"</text><text x="495" y="232" fill="#e2e8f0" font-family="monospace" font-size="13">);</text>
<text x="68" y="259" fill="#64748b" font-family="monospace" font-size="12">05</text><text x="124" y="259" fill="#e2e8f0" font-family="monospace" font-size="13">}</text>
<text x="68" y="286" fill="#64748b" font-family="monospace" font-size="12">06</text><text x="102" y="286" fill="#e2e8f0" font-family="monospace" font-size="13">}</text>
<rect x="102" y="300" width="8" height="16" rx="1" fill="#22d3ee"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
<!-- right Java mark and terminal -->
<rect x="628" y="88" width="330" height="154" rx="13" fill="#0a1728" stroke="#25617c" stroke-width="1.4"/>
<text x="652" y="113" fill="#94a3b8" font-family="monospace" font-size="11">JAVA RUNTIME</text>
<g transform="translate(676 132)" fill="none" stroke="url(#orange)" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
 <path d="M30 3C7 24 58 22 31 42"><animate attributeName="d" values="M30 3C7 24 58 22 31 42;M30 3C52 20 5 27 31 42;M30 3C7 24 58 22 31 42" dur="3.8s" repeatCount="indefinite"/></path>
 <path d="M48 0C28 19 69 24 47 38" opacity=".75"><animate attributeName="d" values="M48 0C28 19 69 24 47 38;M48 0C70 19 26 24 47 38;M48 0C28 19 69 24 47 38" dur="3.1s" repeatCount="indefinite"/></path>
 <path d="M11 49Q37 59 63 49M17 57Q37 65 57 57" stroke="#fb923c"/>
</g>
<text x="780" y="165" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">Java</text>
<text x="780" y="190" fill="#93c5fd" font-family="Inter,Arial,sans-serif" font-size="13">Spring Boot • APIs • SQL</text>
<text x="780" y="211" fill="#64748b" font-family="monospace" font-size="10">JVM ONLINE  ●</text>
<rect x="628" y="258" width="330" height="78" rx="12" fill="#0a1728" stroke="#25617c" stroke-width="1.4"/>
<text x="650" y="281" fill="#94a3b8" font-family="monospace" font-size="10">TERMINAL</text>
<text x="650" y="305" fill="#6ee7b7" font-family="monospace" font-size="12">$ mvn clean install</text>
<text x="650" y="323" fill="#7dd3fc" font-family="monospace" font-size="11">BUILD SUCCESS</text>
<circle cx="925" cy="304" r="5" fill="#34d399" filter="url(#glow)"><animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/></circle>
<path d="M42 360H958" stroke="#24445f"/>
<text x="500" y="379" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="2">DESIGN  •  DEVELOP  •  DELIVER</text>
</svg>