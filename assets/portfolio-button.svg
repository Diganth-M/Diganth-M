<svg xmlns="http://www.w3.org/2000/svg" width="250" height="58" viewBox="0 0 250 58" role="img" aria-labelledby="title">
<title id="title">Visit my portfolio</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102b48"/><stop offset="1" stop-color="#075985"/></linearGradient>
 <linearGradient id="shine"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".48" stop-color="#fff" stop-opacity=".34"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <clipPath id="clip"><rect x="1" y="1" width="248" height="56" rx="14"/></clipPath>
</defs>
<rect x="1" y="1" width="248" height="56" rx="14" fill="url(#bg)" stroke="#38bdf8" stroke-width="1.5"/>
<rect x="1" y="1" width="248" height="56" rx="14" fill="none" stroke="#38bdf8" stroke-opacity=".55">
 <animate attributeName="stroke-opacity" values=".25;.95;.25" dur="2.8s" repeatCount="indefinite"/>
</rect>
<g clip-path="url(#clip)"><rect x="-90" y="0" width="64" height="60" fill="url(#shine)" transform="skewX(-22)"><animate attributeName="x" values="-100;300" dur="3.2s" repeatCount="indefinite"/></rect></g>
<circle cx="30" cy="29" r="11" fill="#38bdf8" fill-opacity=".18"/>
<path d="M25 35V22l11 7-11 6" fill="none" stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="53" y="35" fill="#f0f9ff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing=".8">MY PORTFOLIO</text>
<circle cx="228" cy="29" r="3" fill="#67e8f9"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
</svg>