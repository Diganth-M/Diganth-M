<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">Animated developer coding at a dual-monitor workstation</title>
<desc id="desc">A developer wearing headphones types at a desk with two glowing monitors showing code.</desc>
<defs>
  <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#111c31"/><stop offset="1" stop-color="#080d18"/></linearGradient>
  <linearGradient id="screen" x2="1" y2="1"><stop stop-color="#092b49"/><stop offset="1" stop-color="#071526"/></linearGradient>
  <linearGradient id="desk" x2="0" y2="1"><stop stop-color="#273c5c"/><stop offset="1" stop-color="#111c30"/></linearGradient>
  <linearGradient id="hood" x2="1" y2="1"><stop stop-color="#1b3155"/><stop offset="1" stop-color="#0b1528"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .code{font: bold 11px monospace; fill:#42d9ff; opacity:.9}
    .soft{animation:screenPulse 2.8s ease-in-out infinite}
    .line1{animation:codeBlink 1.7s steps(2,end) infinite}
    .line2{animation:codeBlink 2.2s steps(2,end) infinite .4s}
    .line3{animation:codeBlink 1.9s steps(2,end) infinite .8s}
    .cursor{animation:blink .8s steps(2,end) infinite}
    .hand{transform-box:fill-box;transform-origin:center;animation:type 0.42s ease-in-out infinite alternate}
    .float{animation:float 3.4s ease-in-out infinite}
    .float2{animation:float 3.4s ease-in-out infinite 1.1s}
    @keyframes screenPulse{0%,100%{opacity:.65}50%{opacity:1}}
    @keyframes codeBlink{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
    @keyframes type{from{transform:translateY(-1px)}to{transform:translateY(4px)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  </style>
</defs>
<rect width="900" height="420" rx="24" fill="url(#bg)"/>
<circle cx="150" cy="75" r="110" fill="#0c5b86" opacity=".12"/>
<circle cx="770" cy="85" r="140" fill="#3158c8" opacity=".10"/>
<g class="float" filter="url(#glow)" opacity=".9"><rect x="72" y="72" width="46" height="34" rx="8" fill="#0b2944" stroke="#20c9ff"/><text x="83" y="94" fill="#42d9ff" font-size="17" font-family="monospace">&lt;/&gt;</text></g>
<g class="float2" opacity=".9"><circle cx="805" cy="95" r="22" fill="#102c49" stroke="#23caff"/><path d="M795 95h20M805 85v20" stroke="#43d9ff" stroke-width="3"/></g>
<!-- workstation monitors -->
<g>
 <path d="M125 90L405 42L410 235L137 287Z" fill="#050b13" stroke="#1b4d70" stroke-width="7"/>
 <path d="M139 102L391 59L395 220L149 266Z" fill="url(#screen)" stroke="#21bde9" stroke-width="2"/>
 <path d="M430 58L690 96L682 258L424 217Z" fill="#050b13" stroke="#1b4d70" stroke-width="7"/>
 <path d="M444 73L675 106L668 239L438 205Z" fill="url(#screen)" stroke="#21bde9" stroke-width="2"/>
 <g class="soft">
  <path d="M164 125h95M164 139h145M164 153h105M164 167h124M164 181h80M164 195h130" stroke="#22c7f4" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  <path d="M286 120h80M286 134h65M286 148h88M286 162h53M286 176h73" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" opacity=".9"/>
  <path d="M464 112l35-12 26 14 29-22 38 12 42-17" fill="none" stroke="#42d9ff" stroke-width="3"/>
  <path d="M466 139h165M466 154h135M466 169h153M466 184h100" stroke="#2ac5ee" stroke-width="4" stroke-linecap="round" opacity=".65"/>
  <path d="M594 204v-30m20 30v-51m20 51v-40" stroke="#8b8bff" stroke-width="10" stroke-linecap="round"/>
 </g>
 <path d="M266 272l-2 42 90-16 4-42M533 231l-3 42 83 13 2-42" fill="#172a42" stroke="#315a7d" stroke-width="5"/>
 <path d="M250 316l122-22 34 19-125 27Z" fill="#1b3554" stroke="#267da5" stroke-width="3"/>
 <path d="M525 273l100 15 29 24-104-17Z" fill="#1b3554" stroke="#267da5" stroke-width="3"/>
</g>
<!-- desk -->
<path d="M75 300L465 235L834 318L444 400Z" fill="url(#desk)" stroke="#294d72" stroke-width="4"/>
<path d="M444 400v20M820 322v98" stroke="#1a2b42" stroke-width="18"/>
<!-- chair -->
<path d="M563 229q-18-68 39-83q69-16 95 45l24 130-116 27-61-60Z" fill="#0a1528" stroke="#24466d" stroke-width="5"/>
<!-- coder hoodie/back -->
<path d="M520 239q10-76 91-84q72-5 106 62l30 93-119 51-107-41Z" fill="url(#hood)" stroke="#31577e" stroke-width="5"/>
<path d="M565 170q26-52 72-31q44 18 37 65l-25 24-73-16Z" fill="#07101e" stroke="#234c72" stroke-width="4"/>
<!-- head and headphones -->
<ellipse cx="631" cy="132" rx="39" ry="47" fill="#bd795e"/>
<path d="M593 130q-8-56 39-64q47 1 43 56l-15-23-15-20-39 27Z" fill="#101827"/>
<path d="M592 122q-7-36 17-53q42-23 65 18" fill="none" stroke="#07111e" stroke-width="12"/>
<path d="M589 111q-13 17-4 39" fill="none" stroke="#24c9f4" stroke-width="10" stroke-linecap="round"/>
<rect x="579" y="123" width="18" height="31" rx="8" fill="#123b59" stroke="#29d8ff" stroke-width="3"/>
<!-- arms and hands -->
<path d="M554 254q-42 13-87 43l-25 12q-13 7-8 17q6 11 21 5l73-29 46-21Z" fill="#bd795e"/>
<path d="M685 259q-18 22-51 33l-42 19q-12 8-4 18q8 10 22 4l70-30 38-27Z" fill="#bd795e"/>
<g class="hand"><path d="M445 306q-18-8-28 3l-19 12q-7 7 2 13q8 4 18-2l23-9 15 2q11-5 4-13Z" fill="#d99976"/></g>
<g class="hand"><path d="M593 309q-14-7-25 2l-18 11q-6 8 3 12q9 3 18-4l22-9 13 1q10-6 2-13Z" fill="#d99976"/></g>
<!-- keyboard -->
<path d="M405 333l133-24 62 31-132 27Z" fill="#071322" stroke="#2e82a9" stroke-width="3"/>
<path d="M422 337l107-19M435 346l108-19M450 354l108-19" stroke="#20bfe9" stroke-width="3" stroke-linecap="round" opacity=".8"/>
<path d="M440 330l7 4m10-7 7 4m10-7 7 4m10-7 7 4m10-7 7 4m10-7 7 4" stroke="#9aa8ff" stroke-width="3"/>
<path d="M516 177l30-7" stroke="#42d9ff" stroke-width="2" class="cursor"/>
<g class="float" opacity=".8"><rect x="735" y="185" width="70" height="42" rx="8" fill="#0b2035" stroke="#27c7ef"/><path d="M747 198h42M747 208h30" stroke="#38d8ff" stroke-width="3" stroke-linecap="round"/></g>
<text x="450" y="390" text-anchor="middle" fill="#7ddfff" font-family="monospace" font-size="12" letter-spacing="3">BUILD • DEBUG • CREATE</text>
</svg>