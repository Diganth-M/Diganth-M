<svg xmlns="http://www.w3.org/2000/svg" width="250" height="58" viewBox="0 0 250 58" role="img" aria-labelledby="title">
<title id="title">Explore my projects</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123b32"/><stop offset="1" stop-color="#166534"/></linearGradient>
 <linearGradient id="shine"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".48" stop-color="#fff" stop-opacity=".32"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <clipPath id="clip"><rect x="1" y="1" width="248" height="56" rx="14"/></clipPath>
</defs>
<rect x="1" y="1" width="248" height="56" rx="14" fill="url(#bg)" stroke="#4ade80" stroke-width="1.5"/>
<rect x="1" y="1" width="248" height="56" rx="14" fill="none" stroke="#4ade80" stroke-opacity=".55"><animate attributeName="stroke-opacity" values=".25;.95;.25" dur="3s" repeatCount="indefinite"/></rect>
<g clip-path="url(#clip)"><rect x="-90" y="0" width="64" height="60" fill="url(#shine)" transform="skewX(-22)"><animate attributeName="x" values="-100;300" dur="3.6s" repeatCount="indefinite"/></rect></g>
<path d="M20 23h13l4 4h13v13H20z" fill="none" stroke="#86efac" stroke-width="2" stroke-linejoin="round"/>
<text x="61" y="35" fill="#f0fdf4" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing=".8">MY PROJECTS</text>
<circle cx="228" cy="29" r="3" fill="#86efac"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
