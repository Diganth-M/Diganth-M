<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
<title>Diganth — Live Developer Environment</title>
<desc>Animated dark software engineering workstation with code editor panels, terminal output, moving data streams and a live execution cursor.</desc>
<rect width="960" height="440" rx="22" fill="#080d16"/>
<rect x="1" y="1" width="958" height="438" rx="21" fill="none" stroke="#26384b" stroke-width="2"/>
<g fill="#57d6e8" opacity=".24" font-family="monospace" font-size="13">
<text x="35" y="35">01</text><text x="35" y="65">02</text><text x="35" y="95">03</text><text x="35" y="125">04</text><text x="35" y="155">05</text><text x="35" y="185">06</text><text x="35" y="215">07</text><text x="35" y="245">08</text><text x="35" y="275">09</text><text x="35" y="305">10</text><text x="35" y="335">11</text><text x="35" y="365">12</text>
</g>
<g fill="#49e3a1" opacity=".22" font-family="monospace" font-size="14">
<text x="885" y="42">0101</text><text x="885" y="72">1100</text><text x="885" y="102">0110</text><text x="885" y="132">1011</text><text x="885" y="162">0010</text><text x="885" y="192">1101</text><text x="885" y="222">0100</text><text x="885" y="252">1010</text><text x="885" y="282">0111</text><text x="885" y="312">1001</text><text x="885" y="342">0011</text><text x="885" y="372">1110</text>
</g>
<g>
<rect x="78" y="52" width="535" height="278" rx="12" fill="#0d1928" stroke="#24516a" stroke-width="2"/>
<path d="M78 91H613" stroke="#24516a" stroke-width="2"/>
<circle cx="101" cy="72" r="5" fill="#ff647c"/><circle cx="119" cy="72" r="5" fill="#ffc45c"/><circle cx="137" cy="72" r="5" fill="#48d597"/>
<text x="164" y="77" fill="#9db7c9" font-family="monospace" font-size="13">diganth@devstation  ~/workspace</text>
<text x="102" y="122" fill="#59d6e8" font-family="monospace" font-size="15">$ git status</text>
<text x="102" y="151" fill="#8de6b5" font-family="monospace" font-size="14">On branch main — working tree clean</text>
<text x="102" y="194" fill="#59d6e8" font-family="monospace" font-size="15">$ npm run build</text>
<text x="102" y="223" fill="#8de6b5" font-family="monospace" font-size="14">✓ Compiling modules...</text>
<text x="102" y="250" fill="#8de6b5" font-family="monospace" font-size="14">✓ Optimizing production bundle...</text>
<text x="102" y="277" fill="#8de6b5" font-family="monospace" font-size="14">✓ Build completed successfully</text>
<text x="102" y="310" fill="#b8d2e4" font-family="monospace" font-size="14">$ <tspan fill="#5ff0ae">deploy</tspan><tspan fill="#e9f7ff"> --production</tspan><tspan fill="#5ff0ae">_</tspan><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></text>
</g>
<g>
<rect x="636" y="52" width="246" height="278" rx="12" fill="#0b1723" stroke="#24516a" stroke-width="2"/>
<path d="M636 91H882" stroke="#24516a" stroke-width="2"/>
<text x="658" y="77" fill="#9db7c9" font-family="monospace" font-size="13">SYSTEM MONITOR</text>
<text x="658" y="123" fill="#63e4b1" font-family="monospace" font-size="12">BUILD STATUS</text>
<rect x="658" y="137" width="196" height="8" rx="4" fill="#1c3442"/>
<rect x="658" y="137" width="196" height="8" rx="4" fill="#39d99a"><animate attributeName="width" values="18;196;18" dur="5s" repeatCount="indefinite"/></rect>
<text x="658" y="181" fill="#63e4b1" font-family="monospace" font-size="12">NETWORK STREAM</text>
<g stroke="#3bd9b0" stroke-width="2" opacity=".8">
<path d="M658 216L675 207L691 220L707 198L723 213L739 190L755 204L771 181L787 200L803 187L820 195L850 175" fill="none" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2s" repeatCount="indefinite"/></path>
</g>
<text x="658" y="260" fill="#8ba8bb" font-family="monospace" font-size="12">CPU   34%</text><text x="758" y="260" fill="#8ba8bb" font-family="monospace" font-size="12">RAM   62%</text>
<circle cx="667" cy="294" r="5" fill="#42e39f"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
<text x="681" y="299" fill="#63e4b1" font-family="monospace" font-size="12">LIVE SESSION</text>
</g>
<g fill="none" stroke="#28c6dc" stroke-width="2" opacity=".55">
<path d="M78 355H882"><animate attributeName="stroke-dasharray" values="2 12;12 2;2 12" dur="4s" repeatCount="indefinite"/></path>
</g>
<g font-family="monospace" text-anchor="middle">
<text x="480" y="388" fill="#e2f5ff" font-size="19" font-weight="bold" letter-spacing="4">DIGANTH / ENGINEERING IN MOTION</text>
<text x="480" y="414" fill="#62dcb9" font-size="12" letter-spacing="3">CODE · DEBUG · BUILD · DEPLOY</text>
</g>
<g fill="#4be4bd">
<circle cx="64" cy="390" r="3"><animate attributeName="cy" values="390;365;390" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="898" cy="45" r="3"><animate attributeName="cy" values="45;75;45" dur="2.8s" repeatCount="indefinite"/></circle>
</g>
</svg>