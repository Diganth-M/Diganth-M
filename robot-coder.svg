<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
<title>Animated robot coding at a futuristic workstation</title>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08152c"/><stop offset="1" stop-color="#140d35"/></linearGradient>
 <linearGradient id="screen" x2="1" y2="1"><stop stop-color="#082d55"/><stop offset="1" stop-color="#07172f"/></linearGradient>
 <linearGradient id="metal" x2="0" y2="1"><stop stop-color="#e9f6ff"/><stop offset=".5" stop-color="#91b9d7"/><stop offset="1" stop-color="#3d638f"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
@keyframes blink{0%,46%,52%,100%{opacity:1}49%{opacity:.05}}
@keyframes type{0%{transform:translateY(0)}100%{transform:translateY(-42px)}}
@keyframes hand{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,-5px)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(245px)}}
.code{animation:type 2.7s linear infinite}.blink{animation:blink 1s steps(1) infinite}.hand{transform-origin:520px 390px;animation:hand .65s ease-in-out infinite}.head{transform-origin:560px 275px;animation:bob 3s ease-in-out infinite}.pulse{animation:pulse 1.6s ease-in-out infinite}
</style>
<rect width="900" height="560" rx="28" fill="url(#bg)"/>
<circle cx="680" cy="130" r="190" fill="#075b9c" opacity=".15"/><circle cx="170" cy="390" r="200" fill="#6426b8" opacity=".12"/>
<g opacity=".9" filter="url(#glow)" fill="none" stroke="#12cfff" stroke-width="3"><path d="M55 80h90M55 95h50M770 65h70M800 80h40"/><path d="M95 45l8 8-8 8M810 115l8 8-8 8"/></g>
<text x="450" y="48" fill="#70e9ff" font-family="monospace" font-size="19" text-anchor="middle" letter-spacing="5">D I G I T A L   W O R K S P A C E</text>
<!-- monitors -->
<g stroke="#2de1ff" stroke-width="3" filter="url(#glow)">
 <rect x="95" y="125" width="300" height="205" rx="13" fill="#071426"/><rect x="430" y="105" width="345" height="230" rx="13" fill="#071426"/>
</g>
<rect x="108" y="139" width="274" height="178" rx="5" fill="url(#screen)"/><rect x="443" y="119" width="319" height="202" rx="5" fill="url(#screen)"/>
<g fill="#72eaff" font-family="monospace" font-size="13">
 <text x="125" y="164"> &gt; git status</text><text x="125" y="188" fill="#b68cff">On branch main</text><text x="125" y="212" fill="#6ce8ad">✓ working tree clean</text><text x="125" y="247">&gt; npm run build</text><text x="125" y="271" fill="#6ce8ad">✓ compiled successfully</text>
</g>
<g clip-path="none" class="code" font-family="monospace" font-size="14">
 <g fill="#a9c9ff"><text x="465" y="151">01  const developer = {</text><text x="465" y="179">02    name: "Diganth",</text><text x="465" y="207">03    skills: ["Java", "React"],</text><text x="465" y="235">04    passion: "building"</text><text x="465" y="263">05  };</text><text x="465" y="291">06  developer.create();</text><text x="465" y="319">07  // Keep learning...</text><text x="465" y="347">08  deploy(project);</text></g>
 <g fill="#5ee6bf"><text x="465" y="179"> </text><text x="465" y="207"> </text></g>
</g>
<rect x="443" y="119" width="319" height="202" rx="5" fill="none" stroke="#4de9ff" opacity=".25"/>
<rect x="443" y="119" width="319" height="202" fill="#fff" opacity=".035"><animate attributeName="opacity" values=".02;.09;.02" dur="2s" repeatCount="indefinite"/></rect>
<g stroke="#467fa8" stroke-width="12" stroke-linecap="round"><path d="M245 332v45M580 337v47"/></g><path d="M205 382h80M535 390h90" stroke="#315b83" stroke-width="12" stroke-linecap="round"/>
<!-- desk -->
<path d="M55 420Q440 395 845 425L900 505H0Z" fill="#102b4a" stroke="#147da9" stroke-width="3"/><path d="M0 425Q450 405 900 430" fill="none" stroke="#25dfff" stroke-width="3" filter="url(#glow)"/>
<!-- robot body -->
<g>
 <path d="M475 360Q505 330 580 345Q647 362 670 440L630 475H460L435 425Z" fill="#173c67" stroke="#6fdfff" stroke-width="4"/>
 <path d="M485 368Q555 345 625 380" fill="none" stroke="#a4edff" stroke-width="3" opacity=".7"/>
 <g class="head"><rect x="493" y="220" width="145" height="122" rx="48" fill="url(#metal)" stroke="#9beeff" stroke-width="5"/><rect x="508" y="254" width="115" height="55" rx="22" fill="#071c38" stroke="#29dfff" stroke-width="3"/><ellipse cx="538" cy="281" rx="10" ry="13" fill="#4df4ff" filter="url(#glow)"/><ellipse cx="590" cy="281" rx="10" ry="13" fill="#4df4ff" filter="url(#glow)"/><path d="M546 320q20 13 40 0" fill="none" stroke="#0a6f9b" stroke-width="4" stroke-linecap="round"/><path d="M565 220v-17" stroke="#6feaff" stroke-width="5"/><circle cx="565" cy="198" r="8" fill="#54edff" class="pulse"/></g>
 <path d="M490 375Q445 390 420 414" fill="none" stroke="#9fcce7" stroke-width="25" stroke-linecap="round"/><path d="M420 414l-18 7" stroke="#e4f7ff" stroke-width="19" stroke-linecap="round"/>
 <g class="hand"><path d="M625 385Q660 393 682 411" fill="none" stroke="#9fcce7" stroke-width="24" stroke-linecap="round"/><path d="M682 411l16 7" stroke="#e4f7ff" stroke-width="18" stroke-linecap="round"/></g>
 <circle cx="555" cy="395" r="13" fill="#0d2544" stroke="#43dfff" stroke-width="3"/><text x="555" y="400" text-anchor="middle" font-family="monospace" font-size="12" fill="#74edff">&lt;/&gt;</text>
</g>
<!-- keyboard and accessories -->
<g transform="translate(295 432) skewX(-18)"><rect width="190" height="35" rx="7" fill="#08172c" stroke="#29cfff" stroke-width="2"/><g stroke="#64dcff" stroke-width="3" opacity=".8"><path d="M12 10h12m8 0h12m8 0h12m8 0h12m8 0h12m8 0h12m8 0h12m8 0h12m8 0h12m8 0h12M12 23h12m8 0h12m8 0h12m8 0h12m8 0h12m8 0h12m8 0h12m8 0h12m8 0h12"/></g></g>
<rect x="730" y="390" width="54" height="58" rx="9" fill="#0a1b32" stroke="#5edfff" stroke-width="3"/><path d="M784 404q27 0 18 23q-5 13-18 10" fill="none" stroke="#5edfff" stroke-width="4"/><text x="757" y="426" fill="#c7f5ff" font-family="monospace" font-size="17" text-anchor="middle">GH</text>
<g class="pulse" fill="#4ceaff"><circle cx="90" cy="480" r="4"/><circle cx="825" cy="180" r="4"/><circle cx="365" cy="90" r="3"/><circle cx="710" cy="85" r="3"/></g>
<text x="450" y="535" fill="#8feaff" font-family="monospace" font-size="17" text-anchor="middle" letter-spacing="3">ROBOT MODE: CODING...</text>
</svg>